<a href="{% url 'post-detail' slug=post.slug %}">
    <article class="row align-items-center">
        <div class="col-6">
            <h2>{{ post.title }}</h2>
            <img src="{{ post.image.url }}" alt="{{ post.title }}" class="img-fluid"/>
        </div>
        <div class="col d-flex align-items-center">
            <p class="mb-0">{{ post.description }}</p>
        </div>
    </article>
</a>
