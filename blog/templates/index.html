{% extends "base.html" %}

{% block title %}My Blog{% endblock %}

{% block content %}
    <main class="container py-1 my-5">
        <div class="row align-items-center pb-5 my-5 border rounded-3">
            {% for post in posts %}
                <div class="col-12 col-sm-6 col-lg-4 ">
                    <article class="card m-2 mx-auto" style="width: 20rem;">
                        <img src="{{ post.image.url }}" alt="{{ post.title }}" class="card-img-top"/>
                        <div class="card-body">
                            <h5 class="card-title">{{ post.title }}</h5>
                            <p class="card-text">{{ post.description }}</p>
                            <a href="{% url 'post-detail' slug=post.slug %}" class="btn btn-primary">Read more...</a>
                            <div class="d-flex flex-wrap gap-2 mt-4">
                                {% for tag in post.tags.all %}
                                    <span class="badge {% cycle 'text-bg-light' 'text-bg-primary' 'text-bg-secondary' 'text-bg-success' 'text-bg-danger' 'text-bg-warning' 'text-bg-info' 'text-bg-dark' %}">
                                        {{ tag }}
                                    </span>
                                {% endfor %}
                            </div>
                        </div>
                    </article>
                </div>
            {% endfor %}
        </div>
    </main>
{% endblock %}
