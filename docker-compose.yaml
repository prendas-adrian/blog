# Use postgres/example user/password credentials

services:

  database:
    container_name: postgres_db
    image: postgres:15-alpine
    restart: always
    ports:
      - 5432:5432

    environment:
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "postgres"

  adminer:
    image: dpage/pgadmin4
    restart: always
    ports:
        - "5050:80"
    depends_on:
        - database
